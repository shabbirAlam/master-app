<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Excel Viewer</title>

<script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>

<style>

body{
    font-family: Arial, sans-serif;
    margin:30px;
    background:#f5f5f5;
}

.container{
    background:white;
    padding:20px;
    border-radius:10px;
    box-shadow:0 2px 8px rgba(0,0,0,0.1);
}

h2{
    margin-top:0;
}

input[type=file]{
    margin-right:10px;
}

button{
    padding:10px 20px;
    cursor:pointer;
}

#rowCount{
    margin-top:20px;
    font-weight:bold;
}

table{
    width:100%;
    border-collapse:collapse;
    margin-top:20px;
}

th{
    background:#2563eb;
    color:white;
}

th,td{
    border:1px solid #ddd;
    padding:10px;
    text-align:left;
}

tr:nth-child(even){
    background:#f9f9f9;
}

</style>
</head>
<body>

<div class="container">

    <h2>Excel Viewer</h2>

    <input
        type="file"
        id="excelFile"
        accept=".xls,.xlsx"
    >

    <button onclick="parseExcel()">
        Parse Excel
    </button>

    <div id="rowCount"></div>

    <div id="tableContainer"></div>

</div>

<script>

function parseExcel(){

    const fileInput =
        document.getElementById(
            "excelFile"
        );

    if(!fileInput.files.length){

        alert(
            "Please select an Excel file"
        );

        return;
    }

    const file =
        fileInput.files[0];

    const reader =
        new FileReader();

    reader.onload = function(event){

        const data =
            new Uint8Array(
                event.target.result
            );

        const workbook =
            XLSX.read(
                data,
                {
                    type:"array"
                }
            );

        const firstSheet =
            workbook.SheetNames[0];

        const worksheet =
            workbook.Sheets[
                firstSheet
            ];

        const json =
            XLSX.utils.sheet_to_json(
                worksheet,
                {
                    header:1,
                    defval:""
                }
            );

        renderTable(json);
    };

    reader.readAsArrayBuffer(file);
}

function renderTable(data){

    const tableContainer =
        document.getElementById(
            "tableContainer"
        );

    const rowCount =
        document.getElementById(
            "rowCount"
        );

    if(!data.length){

        tableContainer.innerHTML =
            "<p>No data found</p>";

        return;
    }

    rowCount.innerHTML =
        `Rows: ${data.length - 1}`;

    let html =
        "<table>";

    data.forEach((row,index)=>{

        html += "<tr>";

        row.forEach(cell=>{

            if(index===0){

                html +=
                    `<th>${cell}</th>`;

            }else{

                html +=
                    `<td>${cell}</td>`;
            }
        });

        html += "</tr>";
    });

    html += "</table>";

    tableContainer.innerHTML =
        html;
}

</script>

</body>
</html>
